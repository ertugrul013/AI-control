<template>
  <style>
    @font-face { font-family: 'Public Sans'; font-weight: 400; src: url('assets/fonts/public-sans-400.woff2') format('woff2'); }
    @font-face { font-family: 'Public Sans'; font-weight: 600; src: url('assets/fonts/public-sans-600.woff2') format('woff2'); }
    #root { position: absolute; inset: 0; background: #ffffff; font-family: 'Public Sans', sans-serif; color: #1c2430; overflow: hidden; }
    #classify-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #classify-cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #classify-title { position: absolute; left: 1350px; top: 400px; width: 520px; font-size: 64px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
    #classify-after { opacity: 0; }
    #classify-cursor { position: absolute; left: 0; top: 0; width: 40px; height: 56px; }
  </style>
  <div id="root" data-composition-id="classify" data-width="1920" data-height="1080">
    <div id="classify-cam">
      <img id="classify-before" src="assets/screens/assess-before.png" alt="Questionnaire before the answer" />
      <img id="classify-after" src="assets/screens/assess-after.png" alt="Questionnaire after answering yes" />
    </div>
    <h2 id="classify-title"><span class="cw">Classify</span> <span class="cw">it</span> <span class="cw">in</span> <span class="cw">plain</span> <span class="cw">questions</span></h2>
    <svg id="classify-cursor" viewBox="0 0 20 28" aria-hidden="true">
      <path d="M1 1 L1 22 L6.5 17 L10 26 L13.5 24.5 L10 16 L17 16 Z" fill="#000000" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
    </svg>
  </div>
  <script>
    (function () {
      const W = 1920, H = 1080;
      const frame = (px, py, s, sx = W / 2, sy = H / 2) => ({
        scale: s,
        x: Math.min(0, Math.max(W - W * s, sx - px * s)),
        y: Math.min(0, Math.max(H - H * s, sy - py * s)),
      });
      const screen = (f, px, py) => ({ x: f.x + px * f.scale, y: f.y + py * f.scale });
      const tl = gsap.timeline({ paused: true });

      const wide = { scale: 1.05, x: 120 - 232 * 1.05, y: -52 };
      const question = frame(628, 584.5, 2.0);
      const preview = frame(1170, 235, 2.7);
      // The High badge at the same scale and screen spot as the detail page's badge (match cut).
      const badge = { scale: 3.6, x: 960 - 1099 * 3.6, y: 108 * 3.6 - 203 * 3.6 };
      const yes = screen(question, 240, 617);

      gsap.set('#classify-cam', { transformOrigin: '0 0', scale: 1.3, x: wide.x - 200, y: wide.y - 120, filter: 'blur(10px)' });
      gsap.set('#classify-cursor', { x: 1980, y: 1160 });
      tl.to('#classify-cam', { ...wide, duration: 0.6, ease: 'expo.out' }, 0);
      tl.to('#classify-cam', { filter: 'blur(0px)', duration: 0.25, ease: 'power2.out' }, 0);
      gsap.utils.toArray('#classify-title .cw').forEach((w, i) => {
        tl.fromTo(w, { color: '#c3cad2' }, { color: '#1c2430', duration: 0.12, ease: 'none' }, 0.55 + i * 0.09);
      });
      gsap.set('#classify-title .cw', { color: '#c3cad2' });
      tl.to('#classify-title', { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power2.in' }, 2.3);

      // Punch in on the recruitment question; the cursor answers yes.
      tl.to('#classify-cam', { ...question, duration: 0.55, ease: 'power2.inOut' }, 2.4);
      tl.to('#classify-cursor', { x: yes.x + 2, y: yes.y + 2, duration: 0.8, ease: 'expo.out' }, 2.75);
      tl.to('#classify-cursor', { scale: 0.88, duration: 0.05, ease: 'none' }, 3.55);
      tl.set('#classify-after', { opacity: 1 }, 3.6);
      tl.to('#classify-cursor', { scale: 1, duration: 0.08, ease: 'none' }, 3.6);
      tl.to('#classify-cursor', { opacity: 0, duration: 0.2, ease: 'none' }, 4.0);

      // Over to the live preview, which now says High and why.
      tl.to('#classify-cam', { ...preview, duration: 0.6, ease: 'power2.inOut' }, 3.95);
      tl.to('#classify-cam', { ...badge, duration: 0.7, ease: 'power2.in' }, 6.3);
      window.__timelines['classify'] = tl;
    })();
  </script>
</template>
