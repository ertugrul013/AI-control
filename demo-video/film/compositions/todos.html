<template>
  <style>
    @font-face { font-family: 'Public Sans'; font-weight: 400; src: url('assets/fonts/public-sans-400.woff2') format('woff2'); }
    @font-face { font-family: 'Public Sans'; font-weight: 600; src: url('assets/fonts/public-sans-600.woff2') format('woff2'); }
    #root { position: absolute; inset: 0; background: #ffffff; font-family: 'Public Sans', sans-serif; color: #1c2430; overflow: hidden; }
    #todos-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #todos-cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    /* Regions cut from the after-capture, laid over the before-capture at their own place. */
    #todos-cam img.todos-patch { height: auto; opacity: 0; }
    #todos-cam #todos-row1 { top: 151px; }
    #todos-cam #todos-row3 { top: 277px; }
    #todos-cam #todos-head { top: 98px; }
    #todos-title { position: absolute; left: 60px; top: 680px; font-size: 84px; font-weight: 600; letter-spacing: -0.01em; }
  </style>
  <div id="root" data-composition-id="todos" data-width="1920" data-height="1080">
    <div id="todos-cam">
      <img id="todos-before" src="assets/screens/todos-before.png" alt="Employee to-do list, nothing done" />
      <img id="todos-row1" class="todos-patch" src="assets/screens/todos-row1.png" alt="" />
      <img id="todos-row3" class="todos-patch" src="assets/screens/todos-row3.png" alt="" />
      <img id="todos-head" class="todos-patch" src="assets/screens/todos-head.png" alt="" />
    </div>
    <h2 id="todos-title"><span class="tw">Train</span> <span class="tw">everyone.</span> <span class="tw">Track</span> <span class="tw">it.</span></h2>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const list = { scale: 1.65, x: 60 - 232 * 1.65, y: 0 };
      gsap.set('#todos-cam', { transformOrigin: '0 0', ...list, y: 760, filter: 'blur(14px)' });
      tl.to('#todos-cam', { y: 0, duration: 0.5, ease: 'expo.out' }, 0);
      tl.to('#todos-cam', { filter: 'blur(0px)', duration: 0.25, ease: 'power2.out' }, 0.05);
      gsap.utils.toArray('#todos-title .tw').forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, ease: 'none' }, 0.45 + i * 0.07);
      });
      // Module passed, then the policy acknowledged: each to-do flips on its own frame.
      tl.set('#todos-row1', { opacity: 1 }, 1.4);
      tl.set(['#todos-row3', '#todos-head'], { opacity: 1 }, 2.1);
      tl.to(['#todos-cam', '#todos-title'], { opacity: 0, filter: 'blur(8px)', duration: 0.2, ease: 'power2.in' }, 3.75);
      window.__timelines['todos'] = tl;
    })();
  </script>
</template>
