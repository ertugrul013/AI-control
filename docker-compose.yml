services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicontrol}
      POSTGRES_DB: aicontrol
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aicontrol']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aicontrol:${POSTGRES_PASSWORD:-aicontrol}@db:5432/aicontrol
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
